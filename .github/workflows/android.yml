name: Build ExplorationLite APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_HOME"

          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME"

          cmd_dir=$(find "$ANDROID_HOME" -maxdepth 1 -mindepth 1 -type d -name 'cmdline-tools*' | head -n 1)
          if [ -n "$cmd_dir" ] && [ ! -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            mv "$cmd_dir" "$ANDROID_HOME/cmdline-tools"
          fi

          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-19" "platforms;android-28" "build-tools;34.0.0"

          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: NDK build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ExplorationLite_RE 2>/dev/null || cd .
          $ANDROID_NDK_HOME/ndk-build -C jni \
            NDK_PROJECT_PATH=$PWD \
            APP_BUILD_SCRIPT=$PWD/jni/Android.mk \
            NDK_APPLICATION_MK=$PWD/jni/Application.mk \
            -j$(nproc)

      - name: Package signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          ROOT=$(pwd)
          if [ -d ExplorationLite_RE ]; then ROOT=$ROOT/ExplorationLite_RE; fi
          cd "$ROOT"
          mkdir -p build

          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort | tail -1)
          ZIPALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | sort | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort | tail -1 || true)

          # Prefer a modern android.jar if installed; fall back to 19
          PLATFORM=$ANDROID_HOME/platforms/android-28/android.jar
          if [ ! -f "$PLATFORM" ]; then PLATFORM=$ANDROID_HOME/platforms/android-19/android.jar; fi

          # ---- Java: ELNativeActivity (immersive fullscreen on UI thread) ----
          D8=$(ls $ANDROID_HOME/build-tools/*/d8 2>/dev/null | sort | tail -1 || true)
          DX=$(ls $ANDROID_HOME/build-tools/*/dx 2>/dev/null | sort | tail -1 || true)
          rm -rf build/javac build/dex
          mkdir -p build/javac build/dex
          if [ -d java ]; then
            echo "Compiling Java sources under java/"
            find java -name '*.java' > build/java_sources.txt
            javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM" \
              -classpath "$PLATFORM" -d build/javac @build/java_sources.txt
            if [ -n "$D8" ]; then
              $D8 --lib "$PLATFORM" --output build/dex $(find build/javac -name '*.class')
            elif [ -n "$DX" ]; then
              $DX --dex --output=build/dex/classes.dex build/javac
            else
              echo "ERROR: neither d8 nor dx found in build-tools"; exit 1
            fi
            # d8 may emit classes.dex directly in --output dir
            if [ ! -f build/dex/classes.dex ]; then
              # some d8 versions write to the directory as classes.dex already
              find build/dex -name 'classes*.dex' | head -1
              test -f build/dex/classes.dex || {
                echo "ERROR: classes.dex not produced"; find build/dex -type f; exit 1
              }
            fi
          fi

          # Build resource APK
          $AAPT package -f -M AndroidManifest.xml -S res -A assets \
            -I "$PLATFORM" -F build/base.apk

          # classes.dex (required when hasCode=true)
          if [ -f build/dex/classes.dex ]; then
            (cd build/dex && zip -u ../base.apk classes.dex)
          fi

          # Stage native libs (must use store/uncompressed for reliable install)
          rm -rf build/libstage
          mkdir -p build/libstage
          if [ -f libs/armeabi-v7a/libExplorationLite.so ]; then
            mkdir -p build/libstage/lib/armeabi-v7a
            cp libs/armeabi-v7a/libExplorationLite.so build/libstage/lib/armeabi-v7a/
          fi
          if [ -f libs/x86/libExplorationLite.so ]; then
            mkdir -p build/libstage/lib/x86
            cp libs/x86/libExplorationLite.so build/libstage/lib/x86/
          fi
          # zip -0 = store only (uncompressed) — required for pre-M extractNativeLibs=false,
          # and still safest for .so packaging
          if [ -d build/libstage/lib ]; then
            (cd build/libstage && zip -0 -r ../base.apk lib)
          fi

          # Verify lib + dex present
          unzip -l build/base.apk | grep -E 'lib/.*/libExplorationLite\.so' || {
            echo "ERROR: native library missing from APK"; exit 1
          }
          unzip -l build/base.apk | grep -E 'classes\.dex' || {
            echo "ERROR: classes.dex missing from APK (hasCode=true)"; exit 1
          }

          $ZIPALIGN -f 4 build/base.apk build/aligned.apk

          # ---- Signing ----
          # Prefer repository secrets (stable signature across builds).
          # Fallback to a throwaway debug keystore only when secrets are absent
          # (e.g. PRs from forks that cannot access secrets).
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using repository keystore from secrets"
            KEYSTORE=build/release.keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD}"
            ALIAS="${ANDROID_KEY_ALIAS}"
            OUT_APK=build/ExplorationLite-reimpl.apk
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set — generating ephemeral debug keystore"
            KEYSTORE=build/debug.keystore
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Debug,O=Android,C=US"
            KS_PASS=android
            KEY_PASS=android
            ALIAS=androiddebugkey
            OUT_APK=build/ExplorationLite-reimpl-debug.apk
          fi

          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER sign --ks "$KEYSTORE" --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" --ks-key-alias "$ALIAS" \
              --out "$OUT_APK" build/aligned.apk
            $APKSIGNER verify "$OUT_APK"
          else
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              build/aligned.apk "$ALIAS"
            cp build/aligned.apk "$OUT_APK"
          fi

          # Never leave the keystore in the workspace / artifact
          rm -f "$KEYSTORE"

          ls -la build/*.apk
          echo "APK contents:"
          unzip -l "$OUT_APK" | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExplorationLite-reimpl
          path: |
            **/build/ExplorationLite-reimpl.apk
            **/build/ExplorationLite-reimpl-debug.apk
            **/libs/**/libExplorationLite.so
