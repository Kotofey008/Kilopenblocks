name: Build ExplorationLite APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_HOME"

          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME"

          cmd_dir=$(find "$ANDROID_HOME" -maxdepth 1 -mindepth 1 -type d -name 'cmdline-tools*' | head -n 1)
          if [ -n "$cmd_dir" ] && [ ! -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            mv "$cmd_dir" "$ANDROID_HOME/cmdline-tools"
          fi

          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-19" "platforms;android-28" "build-tools;34.0.0"

          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: NDK build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd ExplorationLite_RE 2>/dev/null || cd .
          $ANDROID_NDK_HOME/ndk-build -C jni \
            NDK_PROJECT_PATH=$PWD \
            APP_BUILD_SCRIPT=$PWD/jni/Android.mk \
            NDK_APPLICATION_MK=$PWD/jni/Application.mk \
            -j$(nproc)

      - name: Package signed APK
        run: |
          set -euxo pipefail
          ROOT=$(pwd)
          if [ -d ExplorationLite_RE ]; then ROOT=$ROOT/ExplorationLite_RE; fi
          cd "$ROOT"
          mkdir -p build

          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort | tail -1)
          ZIPALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | sort | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort | tail -1 || true)

          # Prefer a modern android.jar if installed; fall back to 19
          PLATFORM=$ANDROID_HOME/platforms/android-28/android.jar
          if [ ! -f "$PLATFORM" ]; then PLATFORM=$ANDROID_HOME/platforms/android-19/android.jar; fi

          # Build resource APK
          $AAPT package -f -M AndroidManifest.xml -S res -A assets \
            -I "$PLATFORM" -F build/base.apk

          # Stage native libs (must use store/uncompressed for reliable install)
          rm -rf build/libstage
          mkdir -p build/libstage
          if [ -f libs/armeabi-v7a/libExplorationLite.so ]; then
            mkdir -p build/libstage/lib/armeabi-v7a
            cp libs/armeabi-v7a/libExplorationLite.so build/libstage/lib/armeabi-v7a/
          fi
          if [ -f libs/x86/libExplorationLite.so ]; then
            mkdir -p build/libstage/lib/x86
            cp libs/x86/libExplorationLite.so build/libstage/lib/x86/
          fi
          # zip -0 = store only (uncompressed) — required for pre-M extractNativeLibs=false,
          # and still safest for .so packaging
          if [ -d build/libstage/lib ]; then
            (cd build/libstage && zip -0 -r ../base.apk lib)
          fi

          # Verify lib present
          unzip -l build/base.apk | grep -E 'lib/.*/libExplorationLite\.so' || {
            echo "ERROR: native library missing from APK"; exit 1
          }

          $ZIPALIGN -f 4 build/base.apk build/aligned.apk

          KEYSTORE=build/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Debug,O=Android,C=US"
          fi

          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER sign --ks "$KEYSTORE" --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias androiddebugkey \
              --out build/ExplorationLite-reimpl-debug.apk build/aligned.apk
            $APKSIGNER verify build/ExplorationLite-reimpl-debug.apk
          else
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE" -storepass android -keypass android \
              build/aligned.apk androiddebugkey
            cp build/aligned.apk build/ExplorationLite-reimpl-debug.apk
          fi

          ls -la build/*.apk
          echo "APK contents:"
          unzip -l build/ExplorationLite-reimpl-debug.apk | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExplorationLite-reimpl
          path: |
            **/build/ExplorationLite-reimpl-debug.apk
            **/libs/**/libExplorationLite.so
